name: Tests

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    # §8.5 (2.1.3): the MySQL ledger verification (CoreLedgerAccessMySqlTest)
    # runs against a real mariadb:11 service container - the same gated
    # pattern Solidus Core uses for its own MySQL contract tests.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: solidus
          MARIADB_DATABASE: solidus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -psolidus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SOLIDUS_TEST_MYSQL_HOST: 127.0.0.1
      SOLIDUS_TEST_MYSQL_PORT: 3306
      SOLIDUS_TEST_MYSQL_USER: root
      SOLIDUS_TEST_MYSQL_PASSWORD: solidus
      SOLIDUS_TEST_MYSQL_DATABASE: solidus_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SA2-027: SHA-pinned)

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 (SA2-027)
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 (SA2-027)
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        run: ./gradlew test

      - name: Coverage report (opt-in, non-blocking)
        run: ./gradlew testWithCoverage
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (SA2-027)
        if: always()
        continue-on-error: true
        with:
          name: jacoco-report
          path: build/reports/jacoco/

      - name: SpotBugs (non-blocking during the Java 25 toolchain shakeout)
        run: ./gradlew spotbugsMain
        continue-on-error: true

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (SA2-027)
        if: always()
        continue-on-error: true
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (SA2-027)
        if: always()
        with:
          name: test-results
          path: build/reports/tests/

  # P2: the cloud relay runs its own end-to-end suite on every push/PR.
  # smoke boots the real relay process and plays a fake agent + fake client;
  # sqlite-store additionally kills and restarts the relay mid-test to prove
  # the durable store (rings, offline queue, idempotency) survives.
  relay:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloud-relay

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SA2-027: SHA-pinned)

      - name: Set up Node 24 (node:sqlite)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (SA2-027)
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Relay tests (smoke + security + sqlite restart E2E)
        run: npm test
