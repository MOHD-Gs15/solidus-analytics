name: Tests

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        run: ./gradlew test

      - name: Coverage report (opt-in, non-blocking)
        run: ./gradlew testWithCoverage
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: jacoco-report
          path: build/reports/jacoco/

      - name: SpotBugs (non-blocking during the Java 25 toolchain shakeout)
        run: ./gradlew spotbugsMain
        continue-on-error: true

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/

  # P2: the cloud relay runs its own end-to-end suite on every push/PR.
  # smoke boots the real relay process and plays a fake agent + fake client;
  # sqlite-store additionally kills and restarts the relay mid-test to prove
  # the durable store (rings, offline queue, idempotency) survives.
  relay:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloud-relay

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24 (node:sqlite)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Relay tests (smoke + security + sqlite restart E2E)
        run: npm test
