name: CodeQL

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    # SA2-023: the relay PWA/Node layer is now scanned too. Each language
    # needs its own build mode - Java uses autobuild, JS needs 'none'
    # (JavaScript/TypeScript does not support autobuild).
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SA2-027: SHA-pinned)

      - name: Set up JDK 25
        if: ${{ matrix.language == 'java' }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.0.1 (SA2-027)
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9 (SA2-027)
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9 (SA2-027)
        with:
          category: "/language:${{ matrix.language }}"
