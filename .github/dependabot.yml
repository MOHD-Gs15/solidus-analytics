version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    # 2.4.0 lockstep freeze (VERSIONING.md): the dependencies listed below
    # ship in the family jars or belong to the verified build toolchain.
    # They change only in the next version cycle (2.4.1) with a full family
    # re-drill. Remove these ignore lines when the 2.4.1 cycle opens.
    ignore:
      - dependency-name: "gradle-wrapper"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # SA2-023: the cloud relay (801 lines of Node on the public internet) and
  # its PWA were entirely outside the dependency-SAST umbrella - a future CVE
  # in ws/web-push shipped silently. npm now gets weekly PRs too.
  - package-ecosystem: "npm"
    directory: "/cloud-relay"
    schedule:
      interval: "weekly"
